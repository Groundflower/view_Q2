controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    # 默认值 0.5 是"小于 0.5 m/s 的 y 速度当 0 处理"，全向车横移速度根本到不了 0.5，
    # 那就会被一直清零（表现为"能规划出横移路径但车不动"），所以先降到 0.05；
    # 实测窄槽里 DWB 采样出的 vy 只有 0.029 左右，0.05 仍会把它清零，因此再降到 0.02。
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 全向车在 0.8m 窄槽口做横向对位时，10s 内位移常常不足 0.2m，会被判"卡住"并 abort。
      # 放宽成 0.10m / 20s，只拦真正的停滞。
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 窄槽出口只有 0.8m、目标离墙 0.3m，0.15 的容差要求车中心贴到 15cm 内，
      # 末端会反复对位；放宽到 20cm / 0.25rad（全向车终点朝向不敏感）。
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    # DWB parameters（全向版：x / y / theta 三个方向都有采样）
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.2
      min_vel_y: -0.26
      max_vel_x: 0.26
      max_vel_y: 0.26
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: -3.2
      # 15x20x10 = 3000 条轨迹/周期（20Hz）：横移采样加密（窄槽对位要靠 vy），
      # 旋转采样减半、vx 略减，总样本比原来 20x10x20=4000 少，仿真掉帧的压力小一些。
      vx_samples: 15
      vy_samples: 20
      vtheta_samples: 10
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20
      # 原值 0.25 和 max_vel_x(0.26) 几乎相等，RotateToGoal 会一直认为"平移已停止"，
      # 在槽里提前切成纯旋转；降到 0.05，只有真正停住才交给旋转。
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      # PathAlign/PathDist 原值 32。实测卡在槽外时，车的朝向是"目标方向"，而全局路径要求
      # 先横向（东）绕行，32 的权重把所有位移轨迹压到接近 0 分，结果零速轨迹（不动）反而
      # 最不坏 —— 局部轨迹终点一直等于当前位置。降到 8 / 16，让横移跟路径不再被重罚。
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      # GoalAlign 原值 24 会强烈偏好"车头朝目标"的轨迹。槽内目标在出口反方向时，
      # 路径要求先背离目标出槽，两者互相否决，结果只剩原地左右转（实测 cmd_wz 在 ±1.0 来回）。
      # 降到 8，让 PathAlign/PathDist 主导；GoalDist 你已降到 5.0，保持。
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 16.0
      GoalDist.scale: 5.0
      # 车在原地来回磨超过 oscillation_reset_dist 之后，Oscillation 会把所有"继续移动"
      # 的轨迹判成负分，零速轨迹胜出、从此再也动不了。把重置门槛从默认 0.05 降到 0.02，
      # 让它更容易解除。
      Oscillation.oscillation_reset_dist: 0.02
      Oscillation.oscillation_reset_angle: 0.10
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 车体真实轮廓（base_footprint 系，x 向前）：
      #   chassis 碰撞盒 0.40 x 0.20，轮子（半径 0.05、长 0.05）撑到 x ±0.20 / y ±0.14
      # 写成多边形后，绕 1m 大圆柱和两个小圆柱时才能算出真实间隙。
      # 注意：footprint 一给，robot_radius 就无效了。
      footprint: "[[-0.22, -0.14], [0.22, -0.14], [0.22, 0.14], [-0.22, 0.14]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.26
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[-0.22, -0.14], [0.22, -0.14], [0.22, 0.14], [-0.22, 0.14]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 三维都要跟着 DWB 走：y 方向给 0 的话，横移速度在这里被削成 0。
    # 它是最后一道限幅（controller_server -> cmd_vel_nav -> 本节点 -> cmd_vel -> Gazebo）。
    max_velocity: [0.26, 0.26, 1.0]
    min_velocity: [-0.26, -0.26, -1.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
